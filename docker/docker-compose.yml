version: "3.8"

services:
  socialbotdb:
    image: mariadb:10.6
    container_name: socialbotdb
    env_file:
      - .env
    volumes:
      - mariadb_data:/var/lib/mysql
    restart: unless-stopped
    networks:
      - socialbot_network

    # Healthcheck per attendere che MariaDB sia realmente in ascolto
    healthcheck:
      # CMD-SHELL serve per espandere correttamente le variabili d'ambiente
      test: [ "CMD‑SHELL", "mysqladmin ping -h127.0.0.1 -u$${DB_USER} -p$${DB_PASSWORD} >/dev/null 2>&1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  socialbot:
    build:
      context: ./build
      dockerfile: Dockerfile
    image: socialbot:1.0.0
    container_name: socialbot

    # Aspetta che socialbotdb passi lo healthcheck prima di partire
    depends_on:
      socialbotdb:
        condition: service_healthy

    volumes:
      - ./settings.json:/app/settings.json
    restart: unless-stopped
    networks:
      - socialbot_network
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONIOENCODING=UTF-8

volumes:
  mariadb_data:
    external: true

networks:
  socialbot_network: